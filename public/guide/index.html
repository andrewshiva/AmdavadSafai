<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen SOP Guide — AmdavadSafai</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fb;
      color: #1a1a2e;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .guide-page-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guide-page-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .guide-page-header-left span {
      font-size: 20px;
    }

    .guide-page-header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .guide-page-header h1 small {
      font-weight: 400;
      color: #6b7280;
      font-size: 13px;
      margin-left: 6px;
    }

    .back-to-app {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .back-to-app:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .guide-content {
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .guide-content h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 8px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e5e7eb;
    }

    .guide-content h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin: 32px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f0f0f5;
    }

    .guide-content h3 {
      font-size: 16px;
      font-weight: 600;
      color: #334155;
      margin: 20px 0 8px;
    }

    .guide-content p {
      font-size: 14.5px;
      color: #374151;
      margin-bottom: 12px;
    }

    .guide-content ul, .guide-content ol {
      padding-left: 22px;
      margin-bottom: 14px;
    }

    .guide-content li {
      font-size: 14.5px;
      color: #374151;
      margin-bottom: 6px;
    }

    .guide-content strong {
      color: #1e293b;
    }

    .guide-content hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 28px 0;
    }

    .guide-content code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #6366F1;
    }

    .guide-content blockquote {
      border-left: 3px solid #6366F1;
      background: #f0f0ff;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: #4338CA;
    }

    .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: #9ca3af;
      font-size: 15px;
    }

    .loading-state .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .guide-page-header { padding: 12px 16px; }
      .guide-page-header h1 { font-size: 15px; }
      .guide-page-header h1 small { display: none; }
      .guide-content { padding: 20px 16px 60px; }
      .guide-content h1 { font-size: 22px; }
      .guide-content h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header class="guide-page-header">
    <div class="guide-page-header-left">
      <span>📖</span>
      <h1>Citizen SOP Guide <small>— AmdavadSafai</small></h1>
    </div>
    <a href="/" class="back-to-app">← Back to Map</a>
  </header>

  <main class="guide-content" id="guide-root">
    <div class="loading-state">
      <div class="spinner"></div>
      Loading guide...
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
  <script>
    fetch('/guide/sop_citizens.md')
      .then(r => {
        if (!r.ok) throw new Error('Failed to load guide');
        return r.text();
      })
      .then(md => {
        document.getElementById('guide-root').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('guide-root').innerHTML =
          '<p style="color:#ef4444;text-align:center;padding:40px;">Failed to load guide content. Please try again.</p>';
      });
  </script>
</body>
</html>
